<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$UPERNOVÆ</title>

<!-- preconnect so font TCP handshake starts immediately -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- font-display=swap: text renders instantly in fallback, swaps when ready -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Instrument Sans', sans-serif;
  min-height:100vh; overflow-x:hidden;
  transition:background 0.3s, color 0.3s;
}

body.light { --bg:#eeebe4; --fg:#1a1814; --dim:#9a9080; --border:rgba(0,0,0,0.1); --bar:#f4f1ea; --bar-b:rgba(0,0,0,0.08); --card-bg:rgba(255,255,255,0.55); --pill-bg:rgba(0,0,0,0.06); --pill-fg:var(--dim); --pill-active-bg:#1a1814; --pill-active-fg:#eeebe4; }
body.dark  { --bg:#0c0b0a; --fg:#f0ece6; --dim:#504840; --border:rgba(255,255,255,0.07); --bar:#100f0e; --bar-b:rgba(255,255,255,0.05); --card-bg:rgba(255,255,255,0.03); --pill-bg:rgba(255,255,255,0.07); --pill-fg:var(--dim); --pill-active-bg:#f0ece6; --pill-active-fg:#0c0b0a; }
body.void  { --bg:#000; --fg:#f0ece6; --dim:#3a3835; --border:rgba(255,255,255,0.06); --bar:transparent; --bar-b:transparent; --card-bg:rgba(255,255,255,0.02); --pill-bg:rgba(255,255,255,0.06); --pill-fg:#444; --pill-active-bg:#f0ece6; --pill-active-fg:#000; }

/* ── bar ── */
.bar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; height:52px;
  background:var(--bar); border-bottom:1px solid var(--bar-b);
  transition:background 0.3s, border-color 0.3s;
}
.bar-clock { display:flex; align-items:center; gap:10px; }
.logo { font-size:14px; font-weight:500; letter-spacing:3px; color:var(--fg); transition:color 0.3s; }
.bar-sep { font-size:12px; color:var(--dim); opacity:0.25; }
.bar-time {
  font-size:12px; letter-spacing:1px; color:var(--dim);
  cursor:pointer; transition:color 0.15s; user-select:none;
}
.bar-time:hover { color:var(--fg); }
.theme-fab {
  width:36px; height:36px; border-radius:9px;
  background:transparent; border:1px solid var(--bar-b);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background 0.15s, border-color 0.15s; flex-shrink:0; color:var(--fg);
}
.theme-fab:hover { background:var(--pill-bg); border-color:var(--border); }

/* ── theme menu ── */
.theme-menu {
  position:fixed; top:58px; right:16px; z-index:199;
  background:var(--bar); border:1px solid var(--bar-b);
  border-radius:14px; padding:6px;
  box-shadow:0 8px 32px rgba(0,0,0,0.18);
  min-width:160px;
  opacity:0; pointer-events:none;
  transform:translateY(-6px) scale(0.97);
  transform-origin:top right;
  transition:opacity 0.18s ease, transform 0.18s ease;
}
.theme-menu.open { opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
.tmenu-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:9px; cursor:pointer;
  font-size:13px; color:var(--dim);
  transition:background 0.12s, color 0.12s;
  border:none; background:transparent; width:100%;
  font-family:'Instrument Sans', sans-serif; text-align:left;
}
.tmenu-item:hover { background:var(--pill-bg); color:var(--fg); }
.tmenu-item.active { background:var(--pill-bg); color:var(--fg); font-weight:500; }
.tmenu-item .ticon { width:18px; height:18px; flex-shrink:0; opacity:0.7; display:flex; align-items:center; }
.tmenu-item .ticon svg { width:16px; height:16px; }
.tmenu-item.active .ticon { opacity:1; }

/* ── grid layout ── */
#gl { display:none; min-height:100vh; padding:52px 0 0; background:var(--bg); transition:background 0.3s; }
#gl.on { display:block; }

/* ── hero ── */
.grid-head {
  text-align:center; padding:52px 20px 44px;
  opacity:0; animation:up 0.5s 0.05s forwards;
}
.grid-head h1 {
  font-size:clamp(26px,5.5vw,48px); font-weight:500; letter-spacing:4px;
  color:var(--fg); margin-bottom:10px; transition:color 0.3s;
}
.grid-head p { font-size:11px; color:var(--dim); letter-spacing:2px; transition:color 0.3s; }

/* ── divider ── */
.divider {
  width:100%; height:1px; border:none;
  background:linear-gradient(to right,transparent 0%,var(--border) 35%,var(--border) 65%,transparent 100%);
  transition:background 0.3s;
}

/* ── section headers ── */
.section-header {
  padding:36px 40px 20px;
  max-width:1100px; margin:0 auto;
  opacity:0; animation:up 0.4s 0.1s forwards;
}
.section-label {
  font-family:'DM Mono', monospace;
  font-size:10px; letter-spacing:4px; text-transform:uppercase;
  color:var(--dim); transition:color 0.3s;
}

/* ── cards grid ── */
.cards {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:16px; padding:0 40px 40px;
  max-width:1100px; margin:0 auto;
}
@media (max-width:820px) { .cards { grid-template-columns:repeat(2,1fr); padding:0 20px 40px; } }
@media (max-width:520px) { .cards { grid-template-columns:1fr; } }

/* ── recently added — 3 col same grid ── */
#recent-cards { padding-top:0; }

/* ── sort / filter row ── */
.filter-row {
  padding:0 40px 12px;
  max-width:1100px; margin:0 auto;
  display:flex; flex-direction:column; gap:10px;
  opacity:0; animation:up 0.4s 0.15s forwards;
}
@media (max-width:820px) { .filter-row { padding:0 20px 12px; } }

.filter-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.filter-group-label {
  font-family:'DM Mono', monospace;
  font-size:9px; letter-spacing:3px; text-transform:uppercase;
  color:var(--dim); opacity:0.5; flex-shrink:0; width:68px;
  transition:color 0.3s;
}

/* sort/filter pill */
.spill {
  font-family:'Instrument Sans', sans-serif;
  font-size:11px; letter-spacing:1px;
  padding:5px 13px; border-radius:20px;
  border:1px solid var(--border);
  background:var(--pill-bg); color:var(--pill-fg);
  cursor:pointer; transition:all 0.15s;
  white-space:nowrap;
}
.spill:hover { color:var(--fg); border-color:var(--dim); }
.spill.on {
  background:var(--pill-active-bg);
  color:var(--pill-active-fg);
  border-color:var(--pill-active-bg);
}

/* ── card ── */
.card {
  border-radius:12px; overflow:hidden;
  text-decoration:none; display:flex; flex-direction:column;
  border:1px solid var(--border);
  background:var(--card-bg);
  backdrop-filter:blur(4px);
  opacity:0; animation:up 0.4s forwards;
  transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.3s, background 0.3s;
}
.card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,0,0,0.15); }

.card-img {
  width:100%; height:148px; position:relative; overflow:hidden;
  border-bottom:1px solid var(--border); transition:border-color 0.3s;
}
.card-img canvas { position:absolute; inset:0; width:100%; height:100%; }

.card-info { padding:14px 16px 16px; display:flex; flex-direction:column; gap:5px; }
.card-top-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.card-name {
  font-family:'Instrument Serif', serif; font-size:17px; font-style:italic;
  color:var(--fg); letter-spacing:-0.2px; line-height:1.2;
  transition:color 0.3s; flex:1;
}
.theme-pill {
  font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
  padding:3px 8px; border-radius:20px; font-weight:500;
  white-space:nowrap; flex-shrink:0;
  background:var(--pill-bg); color:var(--pill-fg);
  border:1px solid var(--border);
  transition:background 0.3s, color 0.3s, border-color 0.3s;
}
.card-desc { font-size:12px; line-height:1.55; color:var(--dim); transition:color 0.3s; }
.card-tag  { font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--dim); opacity:0.45; margin-top:3px; transition:color 0.3s; }

/* card stagger — applied by JS */
@keyframes up { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* ── loading shimmer ── */
@keyframes gradientShift { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
.loading-text {
  text-align:center; padding:80px 20px;
  font-family:'DM Mono', monospace; font-size:13px; letter-spacing:3px; text-transform:uppercase;
  background:linear-gradient(90deg,var(--dim) 0%,var(--fg) 25%,var(--dim) 50%,var(--fg) 75%,var(--dim) 100%);
  background-size:200% auto;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  animation:gradientShift 2.4s linear infinite;
  transition:opacity 0.4s ease;
}

/* ── scrollbar ── */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
::-webkit-scrollbar-thumb:hover { background:var(--dim); }
* { scrollbar-width:thin; scrollbar-color:var(--border) transparent; }

/* ── void ── */
#vl { display:none; width:100vw; height:100vh; position:relative; overflow:hidden; background:#000; }
#vl.on { display:block; }
.stars {
  position:absolute; inset:0; pointer-events:none;
  background-image:
    radial-gradient(1px 1px at  7% 11%,rgba(255,255,255,.55) 0%,transparent 100%),
    radial-gradient(1px 1px at 21% 54%,rgba(255,255,255,.30) 0%,transparent 100%),
    radial-gradient(1px 1px at 37% 27%,rgba(255,255,255,.45) 0%,transparent 100%),
    radial-gradient(1px 1px at 67% 17%,rgba(255,255,255,.40) 0%,transparent 100%),
    radial-gradient(1px 1px at 79% 61%,rgba(255,255,255,.26) 0%,transparent 100%),
    radial-gradient(1px 1px at 13% 83%,rgba(255,255,255,.22) 0%,transparent 100%),
    radial-gradient(1px 1px at 57%  7%,rgba(255,255,255,.40) 0%,transparent 100%),
    radial-gradient(1px 1px at 83% 71%,rgba(255,255,255,.24) 0%,transparent 100%),
    radial-gradient(1px 1px at  3% 43%,rgba(255,255,255,.34) 0%,transparent 100%),
    radial-gradient(1px 1px at 46% 46%,rgba(255,255,255,.14) 0%,transparent 100%),
    radial-gradient(1px 1px at 71%  4%,rgba(255,255,255,.30) 0%,transparent 100%),
    radial-gradient(1px 1px at 28% 15%,rgba(255,255,255,.22) 0%,transparent 100%),
    radial-gradient(1px 1px at 62% 89%,rgba(255,255,255,.28) 0%,transparent 100%),
    radial-gradient(1px 1px at 90% 37%,rgba(255,255,255,.32) 0%,transparent 100%),
    radial-gradient(1px 1px at 44% 58%,rgba(255,255,255,.15) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 35% 48%,rgba(255,255,255,.40) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 81% 19%,rgba(255,255,255,.45) 0%,transparent 100%),
    radial-gradient(2px 2px at 50% 20%,rgba(255,255,255,.30) 0%,transparent 100%),
    radial-gradient(2px 2px at 85% 45%,rgba(255,255,255,.25) 0%,transparent 100%);
}
#star-canvas { position:absolute; inset:0; pointer-events:none; }
.oring { position:absolute; top:50%; left:50%; border:1px solid rgba(255,255,255,0.04); border-radius:50%; pointer-events:none; }
.hole-wrap { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:1000; }
.hole-glow {
  position:absolute; top:50%; left:50%; width:340px; height:340px;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,rgba(60,20,80,0.22) 0%,rgba(30,10,50,0.12) 30%,transparent 70%);
  pointer-events:none; z-index:999; border-radius:50%;
}
.hole {
  width:100px; height:100px; border-radius:50%;
  background:radial-gradient(circle at 32% 32%,#181818 0%,#060606 45%,#000 100%);
  box-shadow:0 0 40px rgba(255,255,255,.03),0 0 100px rgba(255,255,255,.012),inset -6px -6px 18px rgba(255,255,255,.02);
  position:relative; overflow:hidden;
}
.hole::after {
  content:''; position:absolute; top:14%; left:20%; width:26%; height:16%;
  background:radial-gradient(ellipse,rgba(255,255,255,.04) 0%,transparent 100%);
  border-radius:50%; transform:rotate(-25deg);
}
.oc { display:none; }
.oi { position:absolute; top:50%; left:50%; will-change:transform; }
.oc-card {
  position:absolute; transform:translate(-50%,-50%);
  width:110px; border-radius:10px; overflow:hidden;
  cursor:pointer; text-decoration:none;
  border:1px solid rgba(255,255,255,.07);
  transition:border-color .2s, box-shadow .2s;
}
.oc-card:hover { border-color:rgba(255,255,255,.25); box-shadow:0 0 20px rgba(255,255,255,.06); }
.oc-thumb { width:100%; height:58px; display:flex; align-items:center; justify-content:center; font-size:22px; background:#0a0a0a; }
.oc-name {
  padding:5px 7px; font-family:'Instrument Serif',serif; font-size:10px; font-style:italic;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:rgba(8,8,8,.95); color:rgba(255,255,255,.5);
}
.void-title {
  position:absolute; top:68px; left:50%; transform:translateX(-50%);
  font-size:11px; font-weight:500; letter-spacing:5px; color:rgba(255,255,255,.08);
  pointer-events:none; z-index:10; white-space:nowrap;
}
.zoom-btns {
  position:absolute; bottom:28px; left:28px; z-index:20;
  display:flex; flex-direction:column; gap:6px;
}
.zoom-btn {
  width:36px; height:36px; border-radius:10px;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,0.35); transition:all 0.15s;
}
.zoom-btn:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.18); color:rgba(255,255,255,0.7); }
</style>

<body>

<!-- bar -->
<div class="bar">
  <div class="bar-clock">
    <span class="logo">$UPERNOVÆ</span>
    <span class="bar-sep">|</span>
    <span class="bar-time" id="bar-time" onclick="cycleTimeFormat()">00:00:00</span>
  </div>
  <button class="theme-fab" id="theme-fab" onclick="toggleThemeMenu()" aria-label="Theme"></button>
</div>

<!-- grid view -->
<div id="gl" class="on">

  <!-- hero -->
  <div class="grid-head">
    <h1>$UPERNOVÆ</h1>
    <p>a collection of small, strange tools</p>
  </div>

  <div class="divider"></div>

  <!-- recently added -->
  <div class="section-header">
    <span class="section-label">Recently Added</span>
  </div>
  <div id="recent-cards" class="cards"></div>

  <div class="divider"></div>

  <!-- all tools -->
  <div class="section-header" style="padding-bottom:16px">
    <span class="section-label">All Tools</span>
  </div>

  <!-- sort + filter pills -->
  <div class="filter-row" id="filter-row">
    <div class="filter-group">
      <span class="filter-group-label">Sort</span>
      <button class="spill" id="sort-desc"  onclick="setSort('desc')"  >Newest first</button>
      <button class="spill" id="sort-asc"   onclick="setSort('asc')"   >Oldest first</button>
      <button class="spill" id="sort-alpha" onclick="setSort('alpha')" >A → Z</button>
    </div>
    <div class="filter-group" id="cat-group">
      <span class="filter-group-label">Category</span>
      <!-- pills injected by JS once tools.json is loaded -->
    </div>
  </div>

  <div id="all-cards" class="cards"></div>

  <div class="divider"></div>

  <footer style="text-align:center;padding:40px 20px;font-size:12px;color:var(--dim);letter-spacing:1px;transition:color 0.3s;">
    made by <a href="https://supernova0866.github.io/Lore" target="_blank" style="color:#4a90d9;text-decoration:none;font-weight:500;">Nova</a>
  </footer>
</div>

<!-- void view -->
<div id="vl">
  <div class="stars"></div>
  <div class="void-title">$UPERNOVÆ</div>
  <canvas id="star-canvas"></canvas>
  <div class="hole-glow"></div>
  <div class="hole-wrap"><div class="hole"></div></div>
  <div class="oc" id="oc"></div>
  <div class="zoom-btns">
    <button class="zoom-btn" onclick="adjustZoom(-1)" title="Zoom in">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><circle cx="9" cy="9" r="6"/><line x1="9" y1="6" x2="9" y2="12"/><line x1="6" y1="9" x2="12" y2="9"/><line x1="14" y1="14" x2="18" y2="18"/></svg>
    </button>
    <button class="zoom-btn" onclick="adjustZoom(1)" title="Zoom out">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><circle cx="9" cy="9" r="6"/><line x1="6" y1="9" x2="12" y2="9"/><line x1="14" y1="14" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>

<!-- theme menu -->
<div class="theme-menu" id="theme-menu">
  <button class="tmenu-item active" id="tm-light" onclick="setLayout('light')">
    <span class="ticon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
    Light
  </button>
  <button class="tmenu-item" id="tm-dark" onclick="setLayout('dark')">
    <span class="ticon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
    Dark
  </button>
  <button class="tmenu-item" id="tm-void" onclick="setLayout('void')">
    <span class="ticon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg></span>
    Void
  </button>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let allTools     = [];
let currentTheme = 'light';
let currentSort  = 'desc';
let currentCat   = 'all';
let voidBuilt    = false;

// ── Load tools.json ───────────────────────────────────────────────────────────
async function loadTools() {
  const r = await fetch('tools.json');
  const d = await r.json();
  return d.tools
    .sort((a,b) => (a.id||0) - (b.id||0))
    .map(t => ({
      id:    t.id,
      name:  t.title || t.name,
      desc:  t.desc,
      src:   t.src   || t.file,
      tag:   t.tag,
      theme: t.theme,
      emoji: t.emoji,
    }));
}

// ── Canvas emoji tile ─────────────────────────────────────────────────────────
function drawTile(canvas, emoji, isDark) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth  || 300;
  const H = canvas.offsetHeight || 148;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.save();
  ctx.translate(W/2, H/2); ctx.rotate(-0.22); ctx.translate(-W/2, -H/2);
  const size=32, gap=14, step=size+gap;
  const cols=Math.ceil(W/step)+3, rows=Math.ceil(H/step)+3;
  ctx.font=`${size}px serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.globalAlpha = isDark ? 0.13 : 0.1;
  for (let row=-2; row<rows; row++)
    for (let col=-2; col<cols; col++)
      ctx.fillText(emoji, col*step + (row%2===0?0:step/2), row*step);
  ctx.restore();
}

// Use IntersectionObserver to defer canvas draws until card is visible
const tileObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const card   = entry.target;
    const canvas = card.querySelector('canvas');
    const emoji  = card.dataset.emoji;
    if (canvas && emoji) {
      const isDark = currentTheme==='dark' || currentTheme==='void';
      drawTile(canvas, emoji, isDark);
    }
    tileObserver.unobserve(card);
  });
}, { rootMargin: '100px' });

function redrawTiles() {
  const isDark = currentTheme==='dark' || currentTheme==='void';
  // sort by vertical position so redraw sweeps top → bottom
  const cards = [...document.querySelectorAll('.card[data-emoji]')]
    .sort((a,b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
  let i = 0;
  function batch() {
    // draw more cards per frame at the top (visible), fewer toward the bottom
    const batchSize = i < 6 ? 4 : i < 18 ? 3 : 2;
    const end = Math.min(i + batchSize, cards.length);
    for (; i < end; i++) {
      const canvas = cards[i].querySelector('canvas');
      if (canvas && cards[i].dataset.emoji)
        drawTile(canvas, cards[i].dataset.emoji, isDark);
    }
    if (i < cards.length) requestAnimationFrame(batch);
  }
  requestAnimationFrame(batch);
}

// ── Build a single card element ───────────────────────────────────────────────
function makeCard(t, delay) {
  const a = document.createElement('a');
  a.className   = 'card';
  a.href        = t.src;
  a.dataset.emoji = t.emoji;
  a.style.animationDelay = delay + 's';
  a.innerHTML = `
    <div class="card-img"><canvas></canvas></div>
    <div class="card-info">
      <div class="card-top-row">
        <div class="card-name">${t.name}</div>
        <span class="theme-pill">${t.theme==='light'?'Light':'Dark'}</span>
      </div>
      <div class="card-desc">${t.desc}</div>
      <div class="card-tag">${t.tag}</div>
    </div>`;
  tileObserver.observe(a);
  return a;
}

// ── Build Recently Added (top 3 by id, fixed) ─────────────────────────────────
function buildRecent(tools) {
  const top3 = [...tools].sort((a,b)=>b.id-a.id).slice(0,3);
  const c = document.getElementById('recent-cards');
  c.innerHTML = '';
  top3.forEach((t,i) => c.appendChild(makeCard(t, 0.05 + i*0.06)));
}

// ── Build All Tools with sort + filter ───────────────────────────────────────
function buildAllTools() {
  let list = [...allTools];

  // filter by category
  if (currentCat !== 'all') list = list.filter(t => t.tag === currentCat);

  // sort
  if      (currentSort==='desc')  list.sort((a,b) => b.id - a.id);
  else if (currentSort==='asc')   list.sort((a,b) => a.id - b.id);
  else if (currentSort==='alpha') list.sort((a,b) => a.name.localeCompare(b.name));

  const c = document.getElementById('all-cards');
  c.innerHTML = '';
  list.forEach((t,i) => c.appendChild(makeCard(t, 0.05 + Math.min(i,12)*0.04)));
}

// ── Build category pills ──────────────────────────────────────────────────────
function buildCatPills(tools) {
  const tags = ['all', ...new Set(tools.map(t=>t.tag).filter(Boolean).sort())];
  const group = document.getElementById('cat-group');
  // clear any old pills (keep the label)
  group.querySelectorAll('.spill').forEach(el=>el.remove());
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'spill' + (tag===currentCat ? ' on' : '');
    btn.id = 'cat-'+tag;
    btn.textContent = tag==='all' ? 'All' : tag;
    btn.onclick = () => setCat(tag);
    group.appendChild(btn);
  });
}

// ── Sort / filter handlers ────────────────────────────────────────────────────
function setSort(s) {
  currentSort = s;
  ['sort-desc','sort-asc','sort-alpha'].forEach(id => {
    document.getElementById(id).classList.toggle('on', id==='sort-'+s);
  });
  buildAllTools();
}

function setCat(cat) {
  currentCat = cat;
  document.querySelectorAll('#cat-group .spill').forEach(btn => {
    btn.classList.toggle('on', btn.id==='cat-'+cat);
  });
  buildAllTools();
}

// ── Void orbit (lazy — only built first time user switches) ───────────────────
const TILT=0.44, BASE_RING_R=170, RING_SPACING=130, BASE_COUNT=4;
let zoomLevel=-2, angles=[], speeds=[], radii=[], ringIndices=[];
let voidOn=false, raf=null, shootingStars=[], twinkleStars=[];

function getRings(n) {
  const rings=[]; let remaining=n, ring=0;
  while (remaining>0) {
    const c=Math.min(BASE_COUNT+ring, remaining);
    const scale=Math.pow(0.88,zoomLevel);
    rings.push({r:(BASE_RING_R+ring*RING_SPACING)*scale, speed:0.00075/(ring+1), count:c});
    remaining-=c; ring++;
  }
  return rings;
}

function buildVoid(toolList) {
  document.querySelectorAll('#vl .oi').forEach(e=>e.remove());
  document.querySelectorAll('.oring').forEach(e=>e.remove());
  angles=[]; speeds=[]; radii=[]; ringIndices=[];
  let idx=0;
  const rings=getRings(toolList.length);
  rings.forEach((ring,ri) => {
    for (let j=0;j<ring.count&&idx<toolList.length;j++,idx++) {
      angles.push((j/ring.count)*Math.PI*2+ri*0.5);
      speeds.push(ring.speed); radii.push(ring.r); ringIndices.push(ri);
      const t=toolList[idx];
      const oi=document.createElement('div'); oi.className='oi'; oi.id='oi'+idx;
      const card=document.createElement('a');
      card.className='oc-card'; card.href=t.src;
      card.innerHTML=`<div class="oc-thumb">${t.emoji}</div><div class="oc-name">${t.name}</div>`;
      oi.appendChild(card);
      document.getElementById('vl').appendChild(oi);
    }
  });
  // ring divs
  const vl=document.getElementById('vl');
  const before=document.querySelector('.hole-glow');
  rings.forEach(ring=>{
    const d=document.createElement('div'); d.className='oring';
    const w=ring.r*2, h=ring.r*2*Math.sin(TILT);
    d.style.cssText=`width:${w}px;height:${h}px;margin-left:${-w/2}px;margin-top:${-h/2}px;`;
    vl.insertBefore(d,before);
  });
  // scale hole + glow
  const zf=Math.pow(0.88,zoomLevel+2);
  const hole=document.querySelector('.hole');
  const glow=document.querySelector('.hole-glow');
  if (hole) hole.style.transform=`scale(${zf})`;
  if (glow) glow.style.transform=`translate(-50%,-50%) scale(${zf})`;
}

function adjustZoom(dir) {
  const prev=zoomLevel;
  zoomLevel=Math.max(-2,Math.min(2,zoomLevel+dir));
  if (zoomLevel===prev) return;
  const saved=[...angles];
  buildVoid(allTools);
  if (saved.length===angles.length) angles=saved;
}

function tickVoid() {
  if (!voidOn) return;
  const states=allTools.map((_,i)=>{
    angles[i]+=speeds[i];
    const r=radii[i], ri=ringIndices[i];
    const x=Math.cos(angles[i])*r, z3d=Math.sin(angles[i])*r;
    const y=z3d*Math.sin(TILT), normZ=z3d/r;
    return {i,x,y,z3d,normZ,r,ri};
  });
  const sorted=[...states].sort((a,b)=>{
    if (Math.abs(a.z3d-b.z3d)>0.5) return a.z3d-b.z3d;
    const fA=a.z3d>=0,fB=b.z3d>=0;
    if (fA&&fB) return a.ri-b.ri;
    if (!fA&&!fB) return b.ri-a.ri;
    return a.z3d-b.z3d;
  });
  sorted.forEach((s,rank)=>{ s._z=s.z3d>=0?1001+rank:rank+1; });
  states.forEach(s=>{
    const el=document.getElementById('oi'+s.i); if(!el)return;
    el.style.transform=`translate(${s.x}px,${s.y}px)`;
    const df=0.55+(s.normZ+1)/2*0.45;
    const rf=Math.pow(0.85,s.ri);
    const zf=Math.pow(0.88,zoomLevel+2);
    const card=el.querySelector('.oc-card');
    card.style.transform=`translate(-50%,-50%) scale(${df*rf*zf})`;
    card.style.opacity=0.18+(s.normZ+1)/2*0.82;
    el.style.zIndex=s._z||1;
  });
  tickStarCanvas();
  raf=requestAnimationFrame(tickVoid);
}

// ── Star canvas ───────────────────────────────────────────────────────────────
function initStarCanvas() {
  const cv=document.getElementById('star-canvas'); if(!cv)return;
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  twinkleStars=Array.from({length:60},()=>({
    x:Math.random()*cv.width, y:Math.random()*cv.height,
    r:Math.random()*1.2+0.3, base:Math.random()*0.4+0.1,
    phase:Math.random()*Math.PI*2, speed:Math.random()*0.02+0.005,
  }));
}
let shootingTimer=0;
function spawnShootingStar(cv) {
  const side=Math.random()<0.5;
  shootingStars.push({
    x:side?-10:cv.width*(0.2+Math.random()*0.6), y:side?cv.height*Math.random()*0.5:-10,
    vx:(3+Math.random()*4)*(side?1:(Math.random()-0.3)), vy:(3+Math.random()*4)*(side?(Math.random()*0.5+0.3):1),
    len:60+Math.random()*80, life:1.0, decay:0.018+Math.random()*0.012,
  });
}
function tickStarCanvas() {
  const cv=document.getElementById('star-canvas'); if(!cv||!voidOn)return;
  const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
  const t=performance.now()/1000;
  twinkleStars.forEach(s=>{
    const a=s.base+Math.sin(t*s.speed*60+s.phase)*s.base*0.8;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${Math.max(0,a)})`; ctx.fill();
  });
  if (++shootingTimer>180+Math.random()*300) { spawnShootingStar(cv); shootingTimer=0; }
  shootingStars=shootingStars.filter(s=>s.life>0);
  shootingStars.forEach(s=>{
    const nx=s.x+s.vx,ny=s.y+s.vy;
    const mag=Math.sqrt(s.vx*s.vx+s.vy*s.vy);
    const grad=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*(s.len/mag),s.y-s.vy*(s.len/mag));
    grad.addColorStop(0,`rgba(255,255,255,${s.life*0.9})`); grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.moveTo(nx,ny);
    ctx.lineTo(s.x-s.vx*(s.len/mag),s.y-s.vy*(s.len/mag));
    ctx.strokeStyle=grad; ctx.lineWidth=1.5*s.life; ctx.stroke();
    s.x=nx; s.y=ny; s.life-=s.decay;
  });
}
window.addEventListener('resize',()=>{
  const cv=document.getElementById('star-canvas');
  if(cv){cv.width=window.innerWidth;cv.height=window.innerHeight;}
});

// ── Layout switching ──────────────────────────────────────────────────────────
const FAB_ICONS = {
  light:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`,
  dark: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
  void: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="18" height="18"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg>`,
};

function setLayout(m) {
  currentTheme=m;

  // suppress all transitions so every element flips in the same frame
  const style = document.createElement('style');
  style.id = '__notransition';
  style.textContent = '* { transition: none !important; }';
  document.head.appendChild(style);

  document.body.className=m;
  document.getElementById('theme-fab').innerHTML=FAB_ICONS[m]||FAB_ICONS.light;
  ['tm-light','tm-dark','tm-void'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(m==='light'?'tm-light':m==='dark'?'tm-dark':'tm-void').classList.add('active');
  document.getElementById('gl').classList.toggle('on',m!=='void');
  document.getElementById('vl').classList.toggle('on',m==='void');

  // re-enable transitions next frame so future interactions animate normally
  requestAnimationFrame(()=>{
    const s = document.getElementById('__notransition');
    if (s) s.remove();
  });

  if (m==='void') {
    if (!voidBuilt && allTools.length) { buildVoid(allTools); voidBuilt=true; }
    voidOn=true; initStarCanvas(); raf=requestAnimationFrame(tickVoid);
  } else {
    voidOn=false; cancelAnimationFrame(raf);
  }

  // canvas sweep top → bottom after the theme has painted
  requestAnimationFrame(redrawTiles);
  closeThemeMenu();
}

function toggleThemeMenu() { document.getElementById('theme-menu').classList.toggle('open'); }
function closeThemeMenu()   { document.getElementById('theme-menu').classList.remove('open'); }
document.addEventListener('click',e=>{ if(!e.target.closest('.theme-menu')&&!e.target.closest('.theme-fab')) closeThemeMenu(); });

// ── Clock ─────────────────────────────────────────────────────────────────────
const TIME_FORMATS=['HH:MM:SS','hh:MM:SS','HH:MM','hh:MM'];
let timeFormatIdx=0;
function cycleTimeFormat() { timeFormatIdx=(timeFormatIdx+1)%TIME_FORMATS.length; }
function formatTime(d,fmt) {
  let h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  const ampm=h>=12?'PM':'AM';
  if(fmt.startsWith('hh'))h=h%12||12;
  const hh=String(h).padStart(2,'0'),mm=String(m).padStart(2,'0'),ss=String(s).padStart(2,'0');
  if(fmt==='HH:MM:SS')return`${hh}:${mm}:${ss}`;
  if(fmt==='hh:MM:SS')return`${hh}:${mm}:${ss} ${ampm}`;
  if(fmt==='HH:MM')return`${hh}:${mm}`;
  return`${hh}:${mm} ${ampm}`;
}
function startClock() {
  const el=document.getElementById('bar-time'); if(!el)return;
  const tick=()=>el.textContent=formatTime(new Date(),TIME_FORMATS[timeFormatIdx]);
  tick(); setInterval(tick,1000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
function getAutoTheme() { const h=new Date().getHours(); return(h>=6&&h<19)?'light':'dark'; }

document.addEventListener('DOMContentLoaded',()=>{
  const theme=getAutoTheme();
  setLayout(theme);
  startClock();

  // set default sort pill active
  document.getElementById('sort-desc').classList.add('on');

  loadTools().then(tools=>{
    allTools=tools;
    buildRecent(tools);
    buildCatPills(tools);
    buildAllTools();
  });
});
</script>
