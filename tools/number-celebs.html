<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMBER CELEBS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

:root {
  --bg:       #0e0a06;
  --panel:    #150f08;
  --gold:     #f5a623;
  --amber:    #e8890a;
  --cream:    #f0e6d3;
  --rust:     #c0392b;
  --dim:      rgba(240,230,211,0.35);
  --border:   rgba(245,166,35,0.18);
  --mono:     'Share Tech Mono', monospace;
  --display:  'Playfair Display', serif;
  --title:    'Bebas Neue', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--cream); font-family: var(--mono); }

/* ── Texture overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(245,166,35,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(192,57,43,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 80%, rgba(245,166,35,0.03) 0%, transparent 50%);
  pointer-events: none;
}

/* ── Layout ── */
#app {
  position: relative; z-index: 1;
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-columns: 320px 1fr;
}

/* ── LEFT: Grid panel ── */
#grid-panel {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: rgba(0,0,0,0.2);
}

#grid-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#grid-title {
  font-family: var(--title);
  font-size: 28px;
  letter-spacing: 6px;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(245,166,35,0.3);
  line-height: 1;
}

#grid-sub {
  font-size: 8px;
  letter-spacing: 3px;
  color: var(--dim);
  margin-top: 5px;
}

#grid-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  scrollbar-width: thin;
  scrollbar-color: rgba(245,166,35,0.2) transparent;
}
#grid-scroll::-webkit-scrollbar { width: 3px; }
#grid-scroll::-webkit-scrollbar-thumb { background: rgba(245,166,35,0.2); }

#number-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.num-tile {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid rgba(245,166,35,0.1);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  position: relative;
  user-select: none;
}

.num-tile:hover {
  border-color: rgba(245,166,35,0.4);
  color: var(--cream);
  background: rgba(245,166,35,0.06);
}

.num-tile.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(245,166,35,0.1);
  text-shadow: 0 0 12px rgba(245,166,35,0.5);
}

.num-tile.active::after {
  content: '';
  position: absolute;
  inset: -1px;
  border: 1px solid var(--gold);
  opacity: 0.4;
  pointer-events: none;
}

/* Category dot */
.num-tile::before {
  content: '';
  position: absolute;
  top: 4px; right: 4px;
  width: 4px; height: 4px;
  border-radius: 50%;
  opacity: 0.6;
}
.num-tile[data-cat="math"]::before    { background: #4ecdc4; }
.num-tile[data-cat="culture"]::before { background: var(--gold); }
.num-tile[data-cat="sports"]::before  { background: #e74c3c; }
.num-tile[data-cat="meme"]::before    { background: #9b59b6; }
.num-tile[data-cat="history"]::before { background: #27ae60; }

/* Legend */
#legend {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 7px;
  letter-spacing: 2px;
  color: var(--dim);
}
.legend-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
}

/* ── RIGHT: Detail panel ── */
#detail-panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px 72px;
  position: relative;
  overflow: hidden;
}

/* Big ambient number watermark */
#detail-watermark {
  position: absolute;
  right: -20px; top: 50%;
  transform: translateY(-50%);
  font-family: var(--display);
  font-size: clamp(180px, 28vw, 340px);
  font-weight: 900;
  color: rgba(245,166,35,0.04);
  line-height: 1;
  pointer-events: none;
  user-select: none;
  transition: opacity 0.4s;
  white-space: nowrap;
}

#detail-content {
  position: relative;
  z-index: 2;
  max-width: 580px;
}

#detail-cat {
  font-size: 8px;
  letter-spacing: 5px;
  color: var(--dim);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
#detail-cat-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}

#detail-number {
  font-family: var(--display);
  font-size: clamp(72px, 12vw, 140px);
  font-weight: 900;
  color: var(--gold);
  line-height: 0.9;
  text-shadow:
    0 0 60px rgba(245,166,35,0.3),
    0 0 120px rgba(245,166,35,0.1);
  transition: opacity 0.2s, transform 0.25s;
  margin-bottom: 10px;
}

#detail-tagline {
  font-family: var(--title);
  font-size: clamp(22px, 3.5vw, 40px);
  letter-spacing: 4px;
  color: var(--cream);
  line-height: 1.1;
  margin-bottom: 28px;
  transition: opacity 0.2s;
}

.detail-divider {
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, var(--gold), transparent);
  margin-bottom: 24px;
  transition: width 0.4s;
}

#detail-body {
  font-size: 12px;
  line-height: 2;
  color: rgba(240,230,211,0.65);
  letter-spacing: 0.3px;
  max-width: 500px;
  transition: opacity 0.2s;
}

#detail-body strong {
  color: var(--cream);
  font-weight: normal;
}

#detail-body em {
  color: var(--gold);
  font-style: normal;
}

/* Empty state */
#detail-empty {
  display: flex;
  flex-direction: column;
  gap: 12px;
  opacity: 0.4;
}
#detail-empty .empty-title {
  font-family: var(--title);
  font-size: 48px;
  letter-spacing: 6px;
  color: var(--gold);
}
#detail-empty .empty-sub {
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--dim);
}

/* ── Info button ── */
#btn-info {
  position: fixed; top: 12px; right: 12px;
  background: transparent; border: 1px solid var(--border);
  color: var(--dim); font-size: 14px; font-family: var(--mono);
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; z-index: 30;
}
#btn-info:hover { border-color: var(--gold); color: var(--gold); }
.info-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.88); backdrop-filter: blur(6px);
  z-index: 40; align-items: center; justify-content: center;
}
.info-overlay.open { display: flex; }
.info-box {
  background: #0d0a06; border: 1px solid var(--border);
  padding: 28px 32px 24px; position: relative; min-width: 280px;
}
.info-brand {
  font-family: var(--mono); font-size: 11px; letter-spacing: 4px;
  color: var(--gold); text-decoration: none; display: block; margin-bottom: 20px;
}
.info-brand:hover { opacity: 0.6; }
.info-close {
  position: absolute; top: 14px; right: 14px;
  background: none; border: 1px solid var(--border);
  color: var(--dim); font-size: 11px; font-family: var(--mono);
  padding: 3px 8px; cursor: pointer;
}
.info-close:hover { border-color: var(--gold); color: var(--gold); }
.info-line { font-size: 10px; letter-spacing: 2px; color: var(--dim); line-height: 2.2; }
.info-nova { color: var(--gold); text-decoration: none; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div id="app">

  <!-- LEFT -->
  <div id="grid-panel">
    <div id="grid-header">
      <div id="grid-title">NUMBER CELEBS</div>
      <div id="grid-sub">50 NUMBERS THAT EARNED THEIR FAME</div>
    </div>
    <div id="grid-scroll">
      <div id="number-grid"></div>
    </div>
    <div id="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#4ecdc4"></div>MATH</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f5a623"></div>CULTURE</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div>SPORTS</div>
      <div class="legend-item"><div class="legend-dot" style="background:#9b59b6"></div>MEME</div>
      <div class="legend-item"><div class="legend-dot" style="background:#27ae60"></div>HISTORY</div>
    </div>
  </div>

  <!-- RIGHT -->
  <div id="detail-panel">
    <div id="detail-watermark"></div>
    <div id="detail-content">
      <div id="detail-empty">
        <div class="empty-title">PICK A NUMBER</div>
        <div class="empty-sub">// 50 NUMBERS. ALL FAMOUS. ALL DESERVE IT.</div>
      </div>
      <div id="detail-main" style="display:none">
        <div id="detail-cat"><div id="detail-cat-dot" class="detail-cat-dot"></div><span id="detail-cat-text"></span></div>
        <div id="detail-number"></div>
        <div id="detail-tagline"></div>
        <div class="detail-divider" id="detail-divider"></div>
        <div id="detail-body"></div>
      </div>
    </div>
  </div>

</div>

<button id="btn-info" onclick="toggleInfo()">ⓘ</button>
<div class="info-overlay" id="info-overlay" onclick="handleOverlayClick(event)">
  <div class="info-box">
    <a href="#" id="info-brand" class="info-brand">$UPERNOVÆ</a>
    <button class="info-close" onclick="closeInfo()">✕</button>
    <div class="info-line">// <span id="info-title">—</span></div>
    <div class="info-line">// Tool <span id="info-id">—</span></div>
    <div class="info-line">// Made by <a href="#" id="info-nova" target="_blank" class="info-nova">Nova</a></div>
  </div>
</div>

<script>
const CAT_COLORS = {
  math:    '#4ecdc4',
  culture: '#f5a623',
  sports:  '#e74c3c',
  meme:    '#9b59b6',
  history: '#27ae60',
};

const NUMBERS = [
  {
    n: 0, cat: 'math',
    tag: 'THE VOID THAT CHANGED EVERYTHING',
    body: `<strong>Zero</strong> didn't exist in Western mathematics until the 7th century — the ancient Greeks couldn't conceptualise "nothing" as a number. Indian mathematician <em>Brahmagupta</em> was the first to define zero and its rules in 628 AD. Before zero, arithmetic was a nightmare and algebra was impossible. Zero is also the only number that is neither positive nor negative, and the only number you genuinely cannot divide by.`,
  },
  {
    n: 1, cat: 'math',
    tag: 'THE LONELIEST PRIME (THAT ISN\'T ONE)',
    body: `<strong>One</strong> is the first counting number and the multiplicative identity — multiply anything by 1 and it stays itself. Mathematicians formally excluded 1 from being a prime number in the 20th century, because including it would break the <em>fundamental theorem of arithmetic</em>. One is also the only positive integer that is its own factorial, its own square, and its own cube simultaneously.`,
  },
  {
    n: 2, cat: 'math',
    tag: 'THE ODD PRIME',
    body: `<strong>Two</strong> is the only even prime number — every other even number is divisible by 2, disqualifying it. It is the basis of all binary computing: every device you have ever used runs on sequences of 1s and 0s. The ancient Chinese considered 2 to represent <em>yin</em>, the feminine force. In most cultures, two is the number of opposition — day/night, good/evil, us/them.`,
  },
  {
    n: 3, cat: 'culture',
    tag: 'THE MAGIC NUMBER',
    body: `<strong>Three</strong> is embedded deeper in human culture than any other digit. The Holy Trinity, the three Fates, three wishes, three strikes, three-act structure, "third time lucky." Psychologists call it the <em>rule of three</em> — humans remember things best in groups of three. In comedy, the setup-setup-punchline structure relies entirely on three. Even "three blind mice" is more satisfying than two or four would be.`,
  },
  {
    n: 7, cat: 'culture',
    tag: 'THE WORLD\'S FAVOURITE NUMBER',
    body: `In a global survey of 30,000 people, <strong>7</strong> was the most commonly chosen "favourite number" by a significant margin. It appears in the seven deadly sins, seven wonders of the world, seven days of the week, seven musical notes, seven colours of the rainbow, and seven continents. In most cultures 7 is lucky. In Japan, the <em>Seven Lucky Gods</em> are central to New Year tradition. Nobody agrees on why 7 feels special. It just does.`,
  },
  {
    n: 8, cat: 'culture',
    tag: 'CHINA\'S GOLDEN NUMBER',
    body: `<strong>Eight</strong> is the luckiest number in Chinese culture because the word for 8 — <em>bā</em> — sounds like the word for prosperity. The 2008 Beijing Olympics deliberately opened at 8:08 PM on 08/08/08. Phone numbers, addresses, and car plates containing 8 sell for premiums. In mathematics, 8 is a cube (2³) and the only positive cube that is one less than a perfect square. Lay it on its side and it becomes infinity.`,
  },
  {
    n: 9, cat: 'culture',
    tag: 'THE NUMBER THAT EATS ITSELF',
    body: `<strong>Nine</strong> has a strange mathematical property: multiply 9 by any integer, then add the digits of the result, and keep adding until you get a single digit — you always end up back at 9. 9×7=63, 6+3=9. It is also the highest single digit, making it the symbol of completeness in many traditions. In Norse mythology, Odin hung on the world tree for <em>nine days</em>. In China, 9 represents the Emperor.`,
  },
  {
    n: 11, cat: 'culture',
    tag: 'ONE LOUDER',
    body: `<strong>11</strong> is famous for being one more than the maximum. In the 1984 mockumentary <em>This Is Spinal Tap</em>, guitarist Nigel Tufnel points to his amp's volume dial that goes to 11 and says "it's one louder." The phrase "up to eleven" entered the Oxford English Dictionary in 2002. 11:11 is also the most wished-upon time on a clock — millions make a wish at that moment daily, a superstition with no traceable origin.`,
  },
  {
    n: 12, cat: 'culture',
    tag: 'THE DOZEN THAT RUNS THE WORLD',
    body: `<strong>12</strong> is a dozenal favourite — divisible by 1, 2, 3, 4, 6 and 12 — more factors than 10, which made it the basis of imperial measurement, time, and calendars. 12 months, 12 hours, 12 apostles, 12 signs of the zodiac, 12 days of Christmas. The Babylonians built their number system around 12. A dozen eggs, a dozen donuts — there's a reason 10-packs feel weird.`,
  },
  {
    n: 13, cat: 'culture',
    tag: 'THE DEVIL\'S DOZEN',
    body: `<strong>13</strong>'s bad luck reputation is ancient and widespread. At the Last Supper there were 13 at the table. In Norse mythology, Loki — the 13th guest at a divine dinner — caused the death of Balder. Fear of 13 is called <em>triskaidekaphobia</em>. Many buildings skip floor 13 entirely. The American $1 bill has 13 arrows, 13 stars, and 13 stripes — deliberately, for the 13 original colonies — but the superstition still dominates.`,
  },
  {
    n: 17, cat: 'culture',
    tag: 'ITALY\'S CURSED NUMBER',
    body: `In Italy, <strong>17</strong> is unlucky — not 13. The Roman numeral XVII can be rearranged to spell <em>VIXI</em>, Latin for "I lived" (meaning "I am dead"). Renault refused to sell the R17 in Italy. Many Italian buildings skip the 17th floor. Formula 1 driver Jules Bianchi died after an accident in 2015 — he wore number 17. Meanwhile, in Brazil 17 is the electoral code for a political party, making it a wildly different cultural symbol.`,
  },
  {
    n: 21, cat: 'culture',
    tag: 'THE AGE OF EVERYTHING',
    body: `<strong>21</strong> is the legal drinking age in the United States, the age of adulthood in many countries, and the winning score in blackjack. Turning 21 has been a cultural milestone for centuries — it was once the age a person could legally own property in England. <em>21 guns</em> is the highest military honour salute. Adele named her second album 21, the age she wrote it. The number just means you've arrived.`,
  },
  {
    n: 23, cat: 'sports',
    tag: 'THE JORDAN NUMBER',
    body: `<strong>23</strong> belongs to Michael Jordan so completely that no single player in NBA history has worn it more famously. Jordan chose 23 because his older brother Larry wore 45 and Michael "wanted to be at least half as good." The number was then worn by LeBron James as tribute. In biology, humans have 23 pairs of chromosomes. The <em>23 Enigma</em> — the belief that 23 appears everywhere meaningfully — became a minor cult phenomenon in the 1970s.`,
  },
  {
    n: 24, cat: 'sports',
    tag: 'KOBE\'S NUMBER',
    body: `<strong>24</strong> is Kobe Bryant's second and final jersey number with the LA Lakers, worn from 2006 until his retirement. He switched from 8 to 24 to represent a "new beginning." After his death in 2020, both 8 and 24 were retired by the Lakers simultaneously — unprecedented for a single player. 24 is also the number of hours in a day, frames per second in film, and carats in pure gold.`,
  },
  {
    n: 27, cat: 'culture',
    tag: 'THE FOREVER CLUB',
    body: `The <strong>27 Club</strong> is the informal name for the striking number of iconic musicians who died at exactly 27: Jimi Hendrix, Janis Joplin, Jim Morrison, Kurt Cobain, Amy Winehouse. Statistically, a 2011 study found no actual spike in musician deaths at 27 — but the myth is now larger than the data. Rolling Stone called it "the age rock stars die." The number carries a strange weight in music to this day.`,
  },
  {
    n: 32, cat: 'history',
    tag: 'THE TEMPERATURE EVERYTHING CHANGES',
    body: `<strong>32°F</strong> is the freezing point of water on the Fahrenheit scale, chosen by Daniel Fahrenheit in 1724 using a brine solution. At exactly 32, water transitions between solid and liquid — one of the most consequential physical thresholds on Earth. 32 is also the number of teeth in a full adult human mouth, the number of teams in the NFL, and the degree at which most weather conversations become interesting.`,
  },
  {
    n: 33, cat: 'culture',
    tag: 'THE AGE OF JESUS',
    body: `<strong>33</strong> is the age at which Jesus Christ is believed to have been crucified, making it a deeply significant number in Christian tradition. There are 33 degrees in Freemasonry. Rolling Rock beer has "33" printed on every bottle — for decades, nobody at the company could explain why. Dante's <em>Divine Comedy</em> has 33 cantos in each of its three books. It is also the normal human spine's vertebrae count.`,
  },
  {
    n: 37, cat: 'meme',
    tag: 'THE INTERNET\'S FAVOURITE RANDOM NUMBER',
    body: `Ask someone to pick a number between 1 and 100 "at random" and <strong>37</strong> comes up disproportionately often — confirmed in multiple informal studies. It feels random because it's odd, not round, and has no obvious cultural attachment. Mathematicians call numbers like this <em>psychologically random</em>. 37 also appears in the Bible 37 times as a symbol of wisdom. Comedians have exploited its perceived randomness for decades.`,
  },
  {
    n: 42, cat: 'culture',
    tag: 'THE ANSWER TO LIFE, THE UNIVERSE, AND EVERYTHING',
    body: `In Douglas Adams' <em>The Hitchhiker's Guide to the Galaxy</em>, a supercomputer called Deep Thought spends 7.5 million years computing the <strong>answer to life, the universe, and everything</strong> — and the answer is 42. Adams claimed he chose it because it was "a perfectly ordinary number, a number not just divisible by two, but also six and seven." The joke is that the answer is meaningless without knowing the question. 42 now appears in cultural references so frequently it has its own Wikipedia page.`,
  },
  {
    n: 44, cat: 'history',
    tag: 'OBAMA\'S NUMBER',
    body: `<strong>Barack Obama</strong> was the 44th President of the United States, the first Black president in American history, serving from 2009 to 2017. The number 44 became a symbol of that historic moment. In Japanese, 44 can be read as <em>shi-shi</em>, meaning "death-death" — doubly unlucky. Yet in American political history, it means something else entirely: a turning point.`,
  },
  {
    n: 47, cat: 'meme',
    tag: 'STAR TREK\'S SECRET NUMBER',
    body: `<strong>47</strong> appears in virtually every episode of <em>Star Trek: The Next Generation</em> and its spinoffs — starship numbers, crew counts, reference codes. It started as an in-joke by writer Joe Menosky, who studied at Pomona College where 47 was considered the quintessential random number. Once you notice it, you cannot stop. The "47 Society" at Pomona College officially documents every appearance. It has logged over 4,000 instances.`,
  },
  {
    n: 54, cat: 'history',
    tag: 'THE STUDIO',
    body: `<strong>Studio 54</strong> was the most famous nightclub in history, open in New York City from 1977 to 1981. Located at 254 West 54th Street, it became synonymous with disco, celebrity, and excess. Andy Warhol, Mick Jagger, and Bianca Jagger were regulars. The door policy was legendarily brutal. It was raided by the IRS in 1978 for tax evasion. The number 54 still conjures a specific era of unapologetic hedonism.`,
  },
  {
    n: 57, cat: 'culture',
    tag: 'HEINZ\'S MAGIC LIE',
    body: `<strong>Heinz 57</strong> varieties — the slogan was invented by Henry John Heinz in 1896. He saw a sign advertising "21 styles of shoes" and was inspired, picking 57 because it felt right. At the time, Heinz actually had over 60 products. The number was never accurate. It didn't matter. "57 Varieties" became one of the most recognised slogans in history, and the 57 is still embossed on every Heinz ketchup bottle — 130 years after the number was made up.`,
  },
  {
    n: 60, cat: 'history',
    tag: 'THE BABYLONIAN LEGACY',
    body: `<strong>60</strong> is why we have 60 seconds in a minute and 60 minutes in an hour — a direct inheritance from the Babylonian sexagesimal number system of 3,500 years ago. The Babylonians chose 60 because it has the most divisors of any number that size: 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60. We still live inside their arithmetic every time we check the time.`,
  },
  {
    n: 64, cat: 'meme',
    tag: 'THE N64 NUMBER',
    body: `<strong>64</strong> is the Nintendo 64's defining number — its 64-bit processor was the selling point in 1996 when the N64 launched and ushered in 3D gaming. The console sold 33 million units. 64 is also 8², the number of squares on a chessboard, and the number of codons in the genetic code. But for an entire generation, 64 means one thing: the smell of a new cartridge and a joystick that broke your thumb.`,
  },
  {
    n: 66, cat: 'history',
    tag: 'THE MOTHER ROAD',
    body: `<strong>Route 66</strong> is the most mythologised highway in America — a 2,448-mile road from Chicago to Los Angeles, established in 1926. It was the path of the Dust Bowl migration, the road of Steinbeck's <em>Grapes of Wrath</em>, and the setting of a song recorded by over 100 artists. It was officially decommissioned in 1985 but remains one of the world's most travelled tourist routes. The number 66 is America's road.`,
  },
  {

// ── Build grid ────────────────────────────────────────────────────────────
const grid = document.getElementById('number-grid');
let activeIdx = null;

NUMBERS.forEach((item, i) => {
  const tile = document.createElement('div');
  tile.className = 'num-tile';
  tile.dataset.cat = item.cat;
  tile.dataset.i   = i;
  tile.textContent = item.n.toLocaleString();
  tile.addEventListener('click', () => selectNumber(i));
  grid.appendChild(tile);
});

// ── Select ────────────────────────────────────────────────────────────────
function selectNumber(i) {
  if (activeIdx === i) return;
  activeIdx = i;
  const item = NUMBERS[i];

  // Update tiles
  document.querySelectorAll('.num-tile').forEach((t, j) => {
    t.classList.toggle('active', j === i);
  });

  const emptyEl  = document.getElementById('detail-empty');
  const mainEl   = document.getElementById('detail-main');
  const numEl    = document.getElementById('detail-number');
  const tagEl    = document.getElementById('detail-tagline');
  const bodyEl   = document.getElementById('detail-body');
  const catText  = document.getElementById('detail-cat-text');
  const catDot   = document.getElementById('detail-cat-dot');
  const watermark = document.getElementById('detail-watermark');

  // Fade out
  mainEl.style.opacity  = '0';
  mainEl.style.transform = 'translateY(6px)';

  setTimeout(() => {
    emptyEl.style.display = 'none';
    mainEl.style.display  = 'block';
    mainEl.style.transition = 'none';

    numEl.textContent  = item.n.toLocaleString();
    tagEl.textContent  = item.tag;
    bodyEl.innerHTML   = item.body;
    catText.textContent = item.cat.toUpperCase();
    catDot.style.background = CAT_COLORS[item.cat];
    watermark.textContent   = item.n.toLocaleString();

    requestAnimationFrame(() => {
      mainEl.style.transition = 'opacity 0.3s, transform 0.3s';
      mainEl.style.opacity    = '1';
      mainEl.style.transform  = 'translateY(0)';
    });
  }, activeIdx === null ? 0 : 160);
}

// ── Info popup ────────────────────────────────────────────────────────────
(async () => {
  try {
    const res  = await fetch('../tools.json');
    const data = await res.json();
    const file = window.location.pathname.split('/').pop() || '';
    const tool = data.tools.find(t => { const s = t.src || t.file || ''; return s === file || s.split('/').pop() === file; });
    if (tool) {
      document.getElementById('info-title').textContent = tool.title || tool.name;
      document.getElementById('info-id').textContent    = '#' + tool.id;
    }
    if (data.main) document.getElementById('info-brand').href = data.main;
    if (data.lore) document.getElementById('info-nova').href  = data.lore;
  } catch(e) {}
})();

function toggleInfo() { document.getElementById('info-overlay').classList.toggle('open'); }
function closeInfo()  { document.getElementById('info-overlay').classList.remove('open'); }
function handleOverlayClick(e) { if (e.target.id === 'info-overlay') closeInfo(); }
</script>
